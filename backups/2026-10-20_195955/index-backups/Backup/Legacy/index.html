<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Олимпиадна Подготовка – 11. клас</title>
<style>
:root {
  --bg:#f1f5f9; --surface:#fff; --surface-2:#f8fafc;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --border:#e2e8f0; --accent:#6366f1; --accent-2:#8b5cf6;
  --success:#10b981; --danger:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.06); --shadow-lg:0 10px 25px rgba(0,0,0,.08);
  --radius:12px; --radius-sm:8px; --sidebar-w:300px;
}
[data-theme="dark"] {
  --bg:#0b1120; --surface:#111827; --surface-2:#1e293b;
  --text:#f1f5f9; --text-2:#94a3b8; --text-3:#64748b;
  --border:#1e293b; --accent:#818cf8; --accent-2:#a78bfa;
  --shadow:0 1px 3px rgba(0,0,0,.3); --shadow-lg:0 10px 25px rgba(0,0,0,.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; transition:background .3s,color .3s; }
.app { display:flex; min-height:100vh; }

/* SIDEBAR */
.sidebar { width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border);
  position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:100; transition:transform .3s; }
.sidebar-header { padding:20px; border-bottom:1px solid var(--border); position:sticky; top:0;
  background:var(--surface); z-index:10; }
.sidebar-header h1 { font-size:16px; font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.sidebar-header p { font-size:12px; color:var(--text-3); margin-top:2px; }
.nav-list { padding:12px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm);
  cursor:pointer; font-size:13px; color:var(--text-2); transition:all .2s; margin-bottom:2px;
  border:none; background:none; width:100%; text-align:left; font-family:inherit; }
.nav-item:hover { background:var(--surface-2); color:var(--text); }
.nav-item.active { background:var(--accent); color:#fff; }
.nav-item.active .nav-progress { color:rgba(255,255,255,.8); }
.nav-icon { font-size:16px; flex-shrink:0; }
.nav-text { flex:1; font-weight:500; }
.nav-progress { font-size:11px; font-weight:600; color:var(--text-3); }
.nav-progress-bar { height:3px; background:var(--border); border-radius:2px; margin-top:6px; overflow:hidden; }
.nav-progress-bar-fill { height:100%; background:var(--accent); border-radius:2px; transition:width .4s; }
.nav-item.active .nav-progress-bar { background:rgba(255,255,255,.2); }
.nav-item.active .nav-progress-bar-fill { background:#fff; }

/* MAIN */
.main { flex:1; margin-left:var(--sidebar-w); min-width:0; }
.topbar { position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 24px; display:flex; align-items:center; gap:16px; backdrop-filter:blur(10px); }
.menu-toggle { display:none; background:none; border:none; font-size:20px; cursor:pointer; color:var(--text); padding:4px; }
.search-box { flex:1; max-width:400px; position:relative; }
.search-box input { width:100%; padding:8px 12px 8px 36px; border:1px solid var(--border);
  border-radius:var(--radius-sm); background:var(--surface-2); color:var(--text); font-size:13px;
  font-family:inherit; outline:none; transition:border-color .2s; }
.search-box input:focus { border-color:var(--accent); }
.search-box::before { content:"🔍"; position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-size:12px; opacity:.5; }
.topbar-actions { display:flex; gap:8px; align-items:center; }
.icon-btn { width:36px; height:36px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--text); cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center; transition:all .2s; }
.icon-btn:hover { background:var(--surface-2); border-color:var(--accent); }

/* OVERALL PROGRESS */
.overall-progress { padding:20px 24px; background:var(--surface); border-bottom:1px solid var(--border); }
.progress-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.progress-stats { display:flex; gap:24px; flex:1; flex-wrap:wrap; }
.stat-value { font-size:20px; font-weight:700; color:var(--text); }
.stat-label { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.5px; }
.progress-bar-large { flex:1; min-width:200px; height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
.progress-bar-large-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2));
  border-radius:4px; transition:width .6s cubic-bezier(.4,0,.2,1); }

/* CONTENT */
.content { padding:24px; max-width:1100px; }
.step-section { margin-bottom:48px; scroll-margin-top:80px; }
.step-header { display:flex; align-items:center; gap:12px; margin-bottom:16px;
  padding-bottom:12px; border-bottom:2px solid var(--border); }
.step-icon { font-size:24px; }
.step-title { font-size:20px; font-weight:700; flex:1; }
.step-badge { font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px;
  background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }
.step-badge.done { background:var(--success); color:#fff; border-color:var(--success); }

/* POINT CARDS */
.points-grid { display:flex; flex-direction:column; gap:10px; }
.point-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; transition:all .2s; position:relative; overflow:hidden; }
.point-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--accent); opacity:0; transition:opacity .2s; }
.point-card:hover { box-shadow:var(--shadow-lg); border-color:var(--accent); }
.point-card:hover::before { opacity:1; }
.point-card.completed { opacity:.7; }
.point-card.completed::before { background:var(--success); opacity:1; }
.point-card.completed .point-title { text-decoration:line-through; color:var(--text-3); }
.point-header { display:flex; align-items:flex-start; gap:12px; cursor:pointer; }
.checkbox { width:20px; height:20px; border-radius:6px; border:2px solid var(--border); flex-shrink:0;
  margin-top:2px; display:flex; align-items:center; justify-content:center; transition:all .2s;
  background:var(--surface); cursor:pointer; }
.checkbox:hover { border-color:var(--accent); }
.checkbox.checked { background:var(--success); border-color:var(--success); }
.checkbox.checked::after { content:"✓"; color:#fff; font-size:12px; font-weight:700; }
.point-info { flex:1; min-width:0; }
.point-number { font-size:11px; font-weight:700; color:var(--accent); margin-bottom:2px; }
.point-title { font-size:15px; font-weight:600; color:var(--text); margin-bottom:4px; }
.point-desc { font-size:13px; color:var(--text-2); margin-bottom:8px; }
.point-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.tag { font-size:11px; padding:2px 8px; border-radius:4px; background:var(--surface-2);
  color:var(--text-2); border:1px solid var(--border); }
.pdf-link { font-size:11px; padding:3px 10px; border-radius:4px; background:var(--accent); color:#fff;
  text-decoration:none; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:4px; }
.pdf-link:hover { background:var(--accent-2); transform:translateY(-1px); }
.pdf-link.bonus { background:var(--accent-2); }
.explanation { margin-top:12px; padding:12px; background:var(--surface-2); border-radius:var(--radius-sm);
  border-left:3px solid var(--accent); font-size:13px; color:var(--text-2); line-height:1.7; }
.explanation strong { color:var(--text); }
.resources-list { margin-top:10px; padding:10px; background:var(--surface-2); border-radius:var(--radius-sm); }
.resources-list h4 { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.resources-list .pdf-link { margin:2px 4px 2px 0; }

/* FILTERS */
.filters { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.filter-btn { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
  color:var(--text-2); font-size:12px; font-weight:500; cursor:pointer; transition:all .2s; font-family:inherit; }
.filter-btn:hover { border-color:var(--accent); color:var(--text); }
.filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.reset-btn { font-size:11px; color:var(--danger); background:none; border:1px solid var(--danger);
  padding:4px 10px; border-radius:4px; cursor:pointer; font-family:inherit; transition:all .2s; }
.reset-btn:hover { background:var(--danger); color:#fff; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-3); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

/* RESPONSIVE */
@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); box-shadow:var(--shadow-lg); }
  .main { margin-left:0; }
  .menu-toggle { display:block; }
  .content { padding:16px; }
  .topbar { padding:10px 16px; }
  .overall-progress { padding:16px; }
  .progress-stats { gap:16px; }
  .stat-value { font-size:16px; }
  .step-title { font-size:17px; }
}

/* SCROLLBAR */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-3); }

@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.point-card { animation:fadeIn .3s ease backwards; }

.toast { position:fixed; bottom:24px; right:24px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 16px; box-shadow:var(--shadow-lg); font-size:13px;
  color:var(--text); z-index:1000; transform:translateY(100px); opacity:0; transition:all .3s;
  display:flex; align-items:center; gap:8px; }
.toast.show { transform:translateY(0); opacity:1; }
.toast.success { border-left:3px solid var(--success); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>📚 Олимпиадна Подготовка</h1>
      <p>11. клас · ППМГ Враца</p>
    </div>
    <nav class="nav-list" id="navList"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Търси тема, теорема, точка...">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Смяна на тема">🌙</button>
        <button class="icon-btn reset-btn" onclick="resetProgress()" title="Нулирай прогреса">↺</button>
      </div>
    </div>

    <div class="overall-progress">
      <div class="progress-row">
        <div class="progress-stats">
          <div class="stat"><div class="stat-value" id="statDone">0</div><div class="stat-label">Завършени</div></div>
          <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Общо</div></div>
          <div class="stat"><div class="stat-value" id="statPercent">0%</div><div class="stat-label">Напредък</div></div>
        </div>
        <div class="progress-bar-large"><div class="progress-bar-large-fill" id="overallFill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="content" id="content">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Всички</button>
        <button class="filter-btn" data-filter="todo">Незапочнати</button>
        <button class="filter-btn" data-filter="done">Завършени</button>
      </div>
      <div id="stepsContainer"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== PDF URL HELPER =====
function pdfUrl(path) {
  // path = "Материали_БГ/OT_2012" (без .pdf)
  return path.split('/').map(encodeURIComponent).join('/') + '.pdf';
}

// ===== DATA =====
// pdf: пълен път без .pdf (от root папката на index.html)
const STEPS = [
{
  id:1, icon:"📐", title:"Геометрия – Основни теореми",
  points:[
    { id:"1.1", title:"Теорема на Менелай", desc:"За колинеарни точки върху страните на триъгълник",
      source:"OT_2012, „Симедиани в триъгълник“ (Стоян Боев); BMC_2003-2006",
      pdf:"Материали_БГ/OT_2012",
      explanation:"Ако точките M, N, P лежат съответно на страните BC, CA, AB на △ABC, то те са колинеарни ⇔ (BM/MC)·(CN/NA)·(AP/PB) = 1. Използва се за доказване на колинеарност и намиране на отношения." },
    { id:"1.2", title:"Теорема на Чева", desc:"За конкурентни чевиани; тригонометрична форма",
      source:"OT_2012, „Симедиани в триъгълник“ (Стоян Боев)",
      pdf:"Материали_БГ/OT_2012",
      explanation:"Чевианите AM, BN, CP са конкурентни ⇔ (BM/MC)·(CN/NA)·(AP/PB) = 1. Тригонометрична форма: sin∠BAM/sin∠MAC · ... = 1." },
    { id:"1.3", title:"Теорема на Птолемей", desc:"За вписан четириъгълник; неравенство на Птолемей",
      source:"OT_2012, „Няколко геометрични неравенства“ (Николай Белухов)",
      pdf:"Материали_БГ/OT_2012",
      explanation:"За вписан четириъгълник ABCD: AC·BD = AB·CD + BC·AD. Неравенство: AC·BD ≤ AB·CD + BC·AD за произволен четириъгълник." },
    { id:"1.4", title:"Степен на точка. Радикална ос. Радикален център", desc:"Основен инструмент за окръжности",
      source:"OT_2010, „Няколко приложения на една лема за вписаната окръжност“ (Николай Белухов)",
      pdf:"Материали_БГ/OT_2010",
      explanation:"Степен на точка P спрямо окръжност: Pow(P) = OP² − R². Радикална ос – множеството от точки с равни степени спрямо две окръжности. Радикален център – пресечната точка на три радикални оси." },
    { id:"1.5", title:"Вписани ъгли, Талес, симетрали", desc:"Базови свойства",
      source:"BMC_2003-2006, решения на геом. задачи",
      pdf:"Материали_БГ/BMC_2003-2006",
      explanation:"Вписан ъгъл = половината от централния, който го обхваща. Талес: ъгъл, опрян на диаметър, е 90°. Симетрала – геометрично място на точките, равноотдалечени от краищата на отсечка." },
    { id:"1.6", title:"Синусова и косинусова теорема – олимпийски приложения", desc:"Не само за страни, но и за ъгли, медиани, ъглополовящи",
      source:"BMS_2012-2015, геом. задачи; OT_2012, „Симедиани“",
      pdf:"Материали_БГ/BMS_2012-2015",
      explanation:"a/sinA = b/sinB = c/sinC = 2R. c² = a² + b² − 2ab·cosC. Приложения: намиране на медиани, ъглополовящи, височини; доказване на ъглови зависимости." },
    { id:"1.7", title:"Формули за лице. Херон", desc:"S = pr, S = abc/4R, Херон",
      source:"BMC_2003-2006, геом. задачи",
      pdf:"Материали_БГ/BMC_2003-2006",
      explanation:"S = (1/2)ab·sinC = abc/(4R) = pr = √(p(p−a)(p−b)(p−c)). Полезни при задачи с вписани/описани окръжности." },
    { id:"1.8", title:"Теорема на Ойлер (I и O). Ойлерова права. Окръжност на деветте точки", desc:"Разстояние IO² = R² − 2Rr",
      source:"BMS_2012-2015, геом. задачи; OT_2012, „Симедиани“",
      pdf:"Материали_БГ/BMS_2012-2015",
      explanation:"IO² = R² − 2Rr (I – инцентър, O – център на описаната). Ойлерова права: O, G, H са колинеарни, OG:GH = 1:2. Окръжност на деветте точки – минава през средите на страните, петите на височините и средите на AH, BH, CH." },
    { id:"1.9", title:"Теорема на Микел", desc:"За четири прави/окръжности – обща точка",
      source:"OT_2010, „Няколко приложения...“ (Николай Белухов)",
      pdf:"Материали_БГ/OT_2010",
      explanation:"Ако четири прави образуват четири триъгълника, то описаните им окръжности минават през една точка – точка на Микел." },
    { id:"1.10", title:"Вписана и външновписани окръжности", desc:"Допирни точки, дължини, ъгли",
      source:"OT_2010, „Няколко приложения...“ (Николай Белухов); BMC_2003-2006",
      pdf:"Материали_БГ/OT_2010",
      explanation:"Вписана окръжност: център I, радиус r. Външновписани: центрове I_a, I_b, I_c. Допирни точки: отсечките от върха до допирните точки са равни. Формули: r = S/p, r_a = S/(p−a)." }
  ]
},
{
  id:2, icon:"🔷", title:"Геометрия – Напреднали техники",
  points:[
    { id:"2.1", title:"Хармонично отношение", desc:"Пълна статия – определение, свойства, приложения",

      pdf:"Материали_БГ/OT_2010",
      explanation:"Четири точки A, B, C, D на права са в хармонично отношение, ако (A,B;C,D) = −1. Приложения: поляри, симедиани, пълни четириъгълници, доказателства за колинеарност." },
    { id:"2.2", title:"Симедиани", desc:"Пълна статия – определение, свойства, точка на Лемоан",
      source:"OT_2012, „Симедиани в триъгълник“ (Стоян Боев) – цялата статия",
      pdf:"Материали_БГ/OT_2012",
      explanation:"Симедиана – изогонална на медианата. Симедианите се пресичат в точката на Лемоан. Свойства: отношение на отсечките, допирателни, хармонично отношение." },
    { id:"2.3", title:"Инверсия", desc:"Трансформация на окръжности в прави; приложения",
      source:"OT_2012, „Симедиани“ (споменава се); BMC_2003-2006",
      pdf:"Материали_БГ/OT_2012",
      explanation:"Инверсия с център O и радиус r: X → X' с OX·OX' = r². Окръжност през O → права; окръжност без O → окръжност. Мощен инструмент за задачи с окръжности и допирателни." },
    { id:"2.4", title:"Спирално подобие", desc:"Композиция от ротация и хомотетия",
      source:"OT_2012, „Симедиани“; BMS_2012-2015",
      pdf:"Материали_БГ/OT_2012",
      explanation:"Спирално подобие – ротация + хомотетия с общ център. Запазва ъгли. Приложения: задачи с два подобни триъгълника, точки на Микел." },
    { id:"2.5", title:"Полюси и поляри", desc:"За окръжност; връзка с радикални оси",
      source:"OT_2010, „Хармонично отношение“",
      pdf:"Материали_БГ/OT_2010",
      explanation:"За окръжност k и точка P – полярата на P е правата, съдържаща допирните точки на допирателните от P. Връзка с хармонично отношение и радикални оси." },
    { id:"2.6", title:"Теорема на Паскал", desc:"За вписан шестоъгълник – колинеарност",

      pdf:"Материали_БГ/OT_2012",

      source:"OT_2012, „Симедиани“",
      pdf:"Материали_БГ/OT_2012",

// ===== STATE =====
let progress = JSON.parse(localStorage.getItem('olympiad_progress') || '{}');
let currentFilter = 'all';
let searchQuery = '';

// ===== INIT =====
function init() {
  buildNav();
  buildContent();
  updateOverallProgress();
  updateThemeButton();
  setupEventListeners();
}

// ===== NAV =====
function buildNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  STEPS.forEach(step => {
    const total = step.points.length;
    const done = step.points.filter(p => progress[p.id]).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const el = document.createElement('button');
    el.className = 'nav-item' + (step.id === 1 ? ' active' : '');
    el.dataset.step = step.id;
    el.innerHTML = `
      <span class="nav-icon">${step.icon}</span>
      <span class="nav-text">${step.id}. ${step.title}</span>
      <span class="nav-progress">${done}/${total}</span>
      <div class="nav-progress-bar"><div class="nav-progress-bar-fill" style="width:${pct}%"></div></div>
    `;
    el.addEventListener('click', () => {
      document.getElementById('step-' + step.id).scrollIntoView({ behavior: 'smooth' });
      setActiveNav(step.id);
      if (window.innerWidth <= 768) toggleSidebar();
    });
    nav.appendChild(el);
  });
}

function setActiveNav(stepId) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.step) === stepId);
  });
}

// ===== CONTENT =====
function buildContent() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = '';

  STEPS.forEach(step => {
    const visiblePoints = step.points.filter(p => matchesFilter(p) && matchesSearch(p));
    if (visiblePoints.length === 0 && (searchQuery || currentFilter !== 'all')) return;

    const section = document.createElement('section');
    section.className = 'step-section';
    section.id = 'step-' + step.id;

    const done = step.points.filter(p => progress[p.id]).length;
    const total = step.points.length;
    const pct = total ? Math.round(done / total * 100) : 0;

    section.innerHTML = `
      <div class="step-header">
        <span class="step-icon">${step.icon}</span>
        <h2 class="step-title">${step.id}. ${step.title}</h2>
        <span class="step-badge ${done === total ? 'done' : ''}">${done}/${total} · ${pct}%</span>
      </div>
      <div class="points-grid"></div>
    `;

    const grid = section.querySelector('.points-grid');

    visiblePoints.forEach((point, idx) => {
      const card = document.createElement('div');
      card.className = 'point-card' + (progress[point.id] ? ' completed' : '');
      card.style.animationDelay = (idx * 30) + 'ms';

      const mainPdf = point.pdf ?
        `<a href="${pdfUrl(point.pdf)}" target="_blank" class="pdf-link" onclick="event.stopPropagation()">📄 ${point.pdf.split('/').pop()}</a>` : '';

      let bonusHtml = '';
      if (point.bonus && point.bonus.length) {
        bonusHtml = `<div class="resources-list">
          <h4>Допълнителни материали</h4>
          ${point.bonus.map(b => `<a href="${pdfUrl(b.pdf)}" target="_blank" class="pdf-link bonus" onclick="event.stopPropagation()">📎 ${b.label}</a>`).join('')}
        </div>`;
      }

      card.innerHTML = `
        <div class="point-header">
          <div class="checkbox ${progress[point.id] ? 'checked' : ''}"></div>
          <div class="point-info">
            <div class="point-number">Точка ${point.id}</div>
            <div class="point-title">${point.title}</div>
            <div class="point-desc">${point.desc}</div>
            <div class="point-meta">
              <span class="tag">📖 ${point.source}</span>
              ${mainPdf}
            </div>
            <div class="explanation">${point.explanation}</div>
            ${bonusHtml}
          </div>
        </div>
      `;

      card.querySelector('.checkbox').addEventListener('click', (e) => {
        e.stopPropagation();
        togglePoint(point.id, card);
      });
      card.querySelector('.point-header').addEventListener('click', () => {
        togglePoint(point.id, card);
      });

      grid.appendChild(card);
    });

    container.appendChild(section);
  });

  if (container.children.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <h3>Няма намерени резултати</h3>
        <p>Опитай с друг филтър или търсене.</p>
      </div>
    `;
  }
}

function matchesFilter(point) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'done') return progress[point.id];
  if (currentFilter === 'todo') return !progress[point.id];
  return true;
}

function matchesSearch(point) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return (
    point.title.toLowerCase().includes(q) ||
    point.desc.toLowerCase().includes(q) ||
    point.source.toLowerCase().includes(q) ||
    point.explanation.toLowerCase().includes(q) ||
    point.id.includes(q)
  );
}

// ===== TOGGLE POINT =====
function togglePoint(id, card) {
  progress[id] = !progress[id];
  localStorage.setItem('olympiad_progress', JSON.stringify(progress));
  card.querySelector('.checkbox').classList.toggle('checked', progress[id]);
  card.classList.toggle('completed', progress[id]);
  updateOverallProgress();
  updateNavProgress();
  if (progress[id]) showToast('✅ Точка ' + id + ' е завършена!', 'success');
}

// ===== UPDATE PROGRESS =====
function updateOverallProgress() {
  let total = 0, done = 0;
  STEPS.forEach(step => {
    step.points.forEach(p => { total++; if (progress[p.id]) done++; });
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPercent').textContent = pct + '%';
  document.getElementById('overallFill').style.width = pct + '%';
}

function updateNavProgress() {
  document.querySelectorAll('.nav-item').forEach(el => {
    const stepId = parseInt(el.dataset.step);
    const step = STEPS.find(s => s.id === stepId);
    if (!step) return;
    const total = step.points.length;
    const done = step.points.filter(p => progress[p.id]).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    el.querySelector('.nav-progress').textContent = done + '/' + total;
    el.querySelector('.nav-progress-bar-fill').style.width = pct + '%';
  });
}

// ===== TOAST =====
let toastTimeout;
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== THEME =====
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('olympiad_theme', next);
  updateThemeButton();
}
function updateThemeButton() {
  const current = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeBtn').textContent = current === 'dark' ? '☀️' : '🌙';
}

// ===== RESET =====
function resetProgress() {
  if (!confirm('Сигурен ли си, че искаш да нулираш целия прогрес?')) return;
  progress = {};
  localStorage.setItem('olympiad_progress', '{}');
  buildContent();
  updateOverallProgress();
  updateNavProgress();
  showToast('🔄 Прогресът е нулиран.');
}

// ===== SIDEBAR =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ===== EVENT LISTENERS =====
function setupEventListeners() {
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    buildContent();
  });
  document.getElementById('filters').addEventListener('click', (e) => {
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    buildContent();
  });
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const stepId = parseInt(entry.target.id.replace('step-', ''));
        setActiveNav(stepId);
      }
    });
  }, { rootMargin: '-80px 0px -70% 0px' });
  setTimeout(() => {
    document.querySelectorAll('.step-section').forEach(s => observer.observe(s));
  }, 100);
  document.addEventListener('click', (e) => {
    const sidebar = document.getElementById('sidebar');
    const toggle = document.querySelector('.menu-toggle');
    if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
      if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    }
  });
}

// ===== START =====
const savedTheme = localStorage.getItem('olympiad_theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
init();
</script>
